<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrcaTerm Proxy 控制台</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1f2430;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --ok: #059669;
    --ok-soft: #ecfdf5;
    --bad: #dc2626;
    --bad-soft: #fef2f2;
    --warn: #d97706;
    --warn-soft: #fffbeb;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1e2127;
      --border: #2d313a;
      --text: #e6e8ec;
      --text-dim: #9aa0ab;
      --accent: #4f8cff;
      --accent-soft: #1c2740;
      --ok: #34d399;
      --ok-soft: #12271f;
      --bad: #f87171;
      --bad-soft: #2a1517;
      --warn: #fbbf24;
      --warn-soft: #2a2113;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 36px; height: 36px; border-radius: 9px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; font-weight: 700; font-size: 18px;
    display: grid; place-items: center;
  }
  h1 { font-size: 18px; margin: 0; }
  h1 small { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 500;
    background: var(--ok-soft); color: var(--ok);
  }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat .num { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .label { color: var(--text-dim); font-size: 12px; }

  section { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 20px; }
  section > h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  section > h2 .hint { color: var(--text-dim); font-size: 12px; font-weight: 400; margin-left: auto; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--text-dim); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  td.num { font-family: var(--mono); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; }
  .pill.yes { background: var(--ok-soft); color: var(--ok); }
  .pill.no { background: var(--bg); color: var(--text-dim); border: 1px solid var(--border); }
  .pill.off { background: var(--warn-soft); color: var(--warn); }
  .pill.fault { background: var(--bad-soft); color: var(--bad); }
  .pill.owner { background: var(--accent-soft); color: var(--accent); }

  button {
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 7px; padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.08); color: #fff; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  textarea, select, input[type=text] {
    width: 100%; border: 1px solid var(--border); border-radius: 7px;
    background: var(--bg); color: var(--text); padding: 8px 10px;
    font: 13px/1.5 var(--mono); resize: vertical;
  }
  textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .actions { margin-top: 10px; display: flex; gap: 8px; }
  .help { color: var(--text-dim); font-size: 12px; margin: 8px 0 0; }
  code { font-family: var(--mono); background: var(--bg); padding: 1px 6px; border-radius: 4px; font-size: 12px; }

  .models { display: flex; flex-wrap: wrap; gap: 8px; }
  .models .pill { font-size: 12px; padding: 3px 10px; font-family: var(--mono); }

  #chatOut {
    margin-top: 10px; min-height: 40px; max-height: 300px; overflow: auto;
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 10px;
    font-size: 13px; white-space: pre-wrap; word-break: break-word;
    color: var(--text-dim);
  }
  #chatOut.done { color: var(--text); }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 9px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s;
    max-width: 80vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .empty { color: var(--text-dim); text-align: center; padding: 18px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">鲸</div>
      <h1>OrcaTerm Proxy<small id="endpoint"></small></h1>
    </div>
    <div class="badge" id="health"><span class="dot"></span>检查中…</div>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="statTotal">–</div><div class="label">账号总数</div></div>
    <div class="stat"><div class="num" id="statEnabled">–</div><div class="label">可用账号</div></div>
    <div class="stat"><div class="num" id="statFault">–</div><div class="label">失败标记</div></div>
    <div class="stat"><div class="num" id="statModels">–</div><div class="label">可用模型</div></div>
  </div>

  <section>
    <h2>账号池 <span class="hint">轮询调度 · 同 UIN 导入即更新</span></h2>
    <table id="accTable">
      <thead>
        <tr><th>UIN</th><th>skey</th><th>p_skey</th><th>状态</th><th>失败</th><th style="width:70px"></th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="accEmpty" hidden>还没有账号，先在下面导入</div>
    <div style="margin-top:14px">
      <textarea id="importText" rows="4" placeholder='支持的格式，任选其一：
1. Cookie 头：uin=o123456; skey=xxx; p_skey=yyy
2. 浏览器导出 JSON：[{"domain":".tencent.com","name":"uin","value":"o123"}]
3. 每行：uin skey p_skey'></textarea>
      <div class="actions">
        <button class="primary" id="btnAdd">添加 / 更新</button>
        <button class="danger" id="btnReplace">替换整个账号池</button>
      </div>
      <p class="help">「添加 / 更新」按 UIN 合并；「替换」清空现有账号后写入当前输入，谨慎操作。</p>
    </div>
  </section>

  <section>
    <h2>模型列表 <span class="hint">以所选账号上游实际开放为准</span></h2>
    <div class="models" id="modelList"><span class="empty">加载中…</span></div>
    <p class="help">对话接口：<code>POST <span id="apiPath"></span></code>，兼容 OpenAI SDK（apiKey 任意值）。</p>
  </section>

  <section>
    <h2>对话测试</h2>
    <div class="row" style="margin-bottom:10px">
      <select id="chatModel" style="width:240px"></select>
      <input type="text" id="chatInput" placeholder="输入一条测试消息，回车发送" style="flex:1">
      <button class="primary" id="btnSend">发送</button>
    </div>
    <div id="chatOut">尚未发送。测试请求走完整的上游链路，可用于验证账号是否可用。</div>
  </section>
</div>
<div id="toast"></div>

<script>
"use strict";
const $ = (sel) => document.querySelector(sel);

function toast(message, isError = false) {
  const el = $("#toast");
  el.textContent = message;
  el.style.background = isError ? "var(--bad)" : "var(--text)";
  el.style.color = isError ? "#fff" : "var(--bg)";
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2400);
}

async function api(path, options) {
  const res = await fetch(path, options);
  let payload = {};
  try { payload = await res.json(); } catch {}
  if (!res.ok) throw new Error(payload.error?.message || `请求失败 (${res.status})`);
  return payload;
}

async function loadHealth() {
  const badge = $("#health");
  try {
    const data = await api("/health");
    badge.className = "badge";
    badge.innerHTML = '<span class="dot"></span>运行中';
  } catch (error) {
    badge.className = "badge bad";
    badge.innerHTML = '<span class="dot"></span>服务异常';
  }
}

async function loadAccounts() {
  let accounts = [];
  try {
    accounts = (await api("/accounts")).accounts || [];
  } catch (error) {
    toast(error.message, true);
  }
  const tbody = $("#accTable tbody");
  tbody.textContent = "";
  $("#accEmpty").hidden = accounts.length > 0;
  for (const acc of accounts) {
    const tr = document.createElement("tr");
    const status = acc.disabled
      ? '<span class="pill off">已停用</span>'
      : acc.failures > 0
        ? `<span class="pill fault">${acc.failures} 次失败</span>`
        : '<span class="pill yes">正常</span>';
    tr.innerHTML = `
      <td class="num">${Number(acc.uin).toLocaleString?.() || acc.uin}</td>
      <td>${acc.hasSkey ? '<span class="pill yes">有</span>' : '<span class="pill no">无</span>'}</td>
      <td>${acc.hasPSkey ? '<span class="pill yes">有</span>' : '<span class="pill no">无</span>'}</td>
      <td>${status}</td>
      <td class="num">${acc.failures || 0}</td>
      <td><button class="danger" data-uin="${acc.uin}">删除</button></td>`;
    tbody.appendChild(tr);
  }
  const enabled = accounts.filter((a) => !a.disabled).length;
  const faults = accounts.filter((a) => a.failures > 0).length;
  $("#statTotal").textContent = accounts.length;
  $("#statEnabled").textContent = enabled;
  $("#statFault").textContent = faults;
  $("#accTable").style.display = accounts.length ? "" : "none";
}

async function loadModels() {
  const data = await api("/v1/models");
  const models = data.data || [];
  $("#statModels").textContent = models.length;
  const list = $("#modelList");
  list.textContent = "";
  const groups = new Map();
  for (const m of models) {
    if (!groups.has(m.owned_by)) groups.set(m.owned_by, []);
    groups.get(m.owned_by).push(m.id);
  }
  for (const [owner, ids] of groups) {
    for (const id of ids) {
      const pill = document.createElement("span");
      pill.className = "pill";
      if (owner === "tencent") pill.classList.add("owner");
      pill.textContent = id;
      pill.title = owner;
      list.appendChild(pill);
    }
  }
  const select = $("#chatModel");
  select.textContent = "";
  for (const m of models) {
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = m.id;
    select.appendChild(opt);
  }
}

async function importAccounts(method) {
  const text = $("#importText").value.trim();
  if (!text) return toast("先粘贴账号内容", true);
  const confirmNeeded = method === "PUT";
  if (confirmNeeded && !confirm("替换会清空现有全部账号，确定继续？")) return;
  try {
    await api("/accounts", {
      method,
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ raw: text }),
    });
    toast(method === "PUT" ? "账号池已替换" : "账号已导入");
    $("#importText").value = "";
    await loadAccounts();
  } catch (error) {
    toast(error.message, true);
  }
}

async function deleteAccount(uin) {
  if (!confirm(`删除账号 ${uin}？`)) return;
  try {
    const result = await api(`/accounts/${encodeURIComponent(uin)}`, { method: "DELETE" });
    toast(result.removed ? "已删除" : "没有这个账号", !result.removed);
    await loadAccounts();
  } catch (error) {
    toast(error.message, true);
  }
}

async function sendChat() {
  const input = $("#chatInput");
  const message = input.value.trim();
  if (!message) return;
  const out = $("#chatOut");
  const btn = $("#btnSend");
  btn.disabled = true;
  out.className = "";
  out.textContent = "请求中…";
  try {
    const data = await api("/v1/chat/completions", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        model: $("#chatModel").value,
        stream: false,
        messages: [{ role: "user", content: message }],
      }),
    });
    out.className = "done";
    out.textContent = data.choices?.[0]?.message?.content || "(空回复)";
    input.value = "";
  } catch (error) {
    out.className = "";
    out.textContent = `失败：${error.message}`;
  } finally {
    btn.disabled = false;
    loadAccounts();
  }
}

$("#btnAdd").addEventListener("click", () => importAccounts("POST"));
$("#btnReplace").addEventListener("click", () => importAccounts("PUT"));
$("#btnSend").addEventListener("click", sendChat);
$("#chatInput").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.isComposing) sendChat();
});
$("#accTable").addEventListener("click", (event) => {
  const uin = event.target?.dataset?.uin;
  if (uin) deleteAccount(uin);
});

const origin = location.origin;
$("#endpoint").textContent = origin;
$("#apiPath").textContent = `${origin}/v1/chat/completions`;

loadHealth();
loadAccounts();
loadModels().catch((error) => toast(error.message, true));
setInterval(loadHealth, 30000);
</script>
</body>
</html>
